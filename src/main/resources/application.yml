spring:
  profiles:
    # 환경변수 SPRING_PROFILES_ACTIVE 가 없으면 local
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      "local": "local,common"
      "prod": "prod,common"
---
spring:
  config.activate.on-profile: "common"
  application.name: addon-manager
  jackson.time-zone: Asia/Seoul
  jpa:
    hibernate.ddl-auto: none          # 스키마는 SQL 스크립트(docs/sql)로 관리
    open-in-view: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    # docker-compose 의 환경변수명(SPRING_DATASOURCE_*)과 동일하게 맞춘다
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      max-lifetime: 57000             # DB wait_timeout(60초)보다 2~3초 짧게
  # MongoDB 는 잠시 비활성화(build.gradle 참고). 복구할 때 아래 설정을 되살린다.
  # 접속 계정이 들어 있으므로 환경변수로만 받는다. Boot 4 는 spring.mongodb.uri 를 쓰므로
  # compose 의 SPRING_DATA_MONGODB_URI 를 명시적으로 연결한다.
  # mongodb:
  #   uri: ${SPRING_DATA_MONGODB_URI}
server:
  port: ${SERVER_PORT:5534}           # compose 의 SERVER_PORT 와 동일, 기본 5534
  # Cloudflare Tunnel 등 프록시 뒤에서는 앱이 요청을 http 로 보게 된다. X-Forwarded-* 헤더를 반영해
  # 원래의 https/도메인으로 인식하게 한다(안 그러면 같은 사이트의 요청이 CORS 의 "다른 출처"로 판정된다).
  # 앱 포트가 127.0.0.1 로만 열려 있어 프록시를 거치지 않은 요청은 들어올 수 없다는 전제다.
  forward-headers-strategy: framework
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}   # 32바이트 이상(HS256). 짧으면 기동 실패
    access-valid-seconds: ${JWT_ACCESS_VALID_SECONDS:3600}
  curseforge:
    api-key: ${CURSEFORGE_API_KEY:}       # 서버에만 둔다. 비어 있으면 CurseForge 호출 시 오류
    base-url: https://api.curseforge.com
  downloads-dir: ${DOWNLOADS_DIR:}        # 데스크톱 앱 설치 파일 폴더(/downloads/** 로 서빙). 비우면 비활성
  admin:                                  # 최초 관리자 계정. 값이 비어 있으면 생성하지 않는다
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}
---
spring:
  config.activate.on-profile: "local"
  jpa.show-sql: true
app:
  cors.allowed-origins: http://localhost:3000,http://localhost:5173
---
spring:
  config.activate.on-profile: "prod"
  jpa.show-sql: false
springdoc:
  api-docs.enabled: false             # 운영에서는 Swagger 비공개
  swagger-ui.enabled: false
app:
  # 프론트를 같은 서버에서 서빙하므로 사이트 도메인만 허용한다. 비워 두면 브라우저가 Origin 을 붙인
  # 정적 파일 요청(Vite 의 crossorigin 속성)이 CORS 검사에 걸려 403 이 되어 화면이 비어 보인다.
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:https://addon-manager.shapinel.com}
